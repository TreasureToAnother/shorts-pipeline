name: Update Channel Analytics

on:
  schedule:
    - cron: "7 * * * *"  # every hour
  workflow_dispatch: {}

permissions:
  contents: write

# Shares a concurrency group with the main pipeline (see pipeline.yml)
# so the two workflows queue instead of racing to push to main at the
# same time — GitHub runs at most one job per group, queuing the rest.
concurrency:
  group: repo-git-writer

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client==2.143.0

      - name: Snapshot analytics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python agents/analytics_agent.py

      - name: Commit analytics data
        run: |
          git add data/analytics_latest.json data/analytics_history.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit"
            exit 0
          fi
          git commit -m "Update channel analytics [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely raced another workflow run) — pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Failed to push analytics data after retries"
          exit 1
