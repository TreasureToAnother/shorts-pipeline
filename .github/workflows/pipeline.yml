name: Run History Shorts Pipeline

on:
  schedule:
    - cron: "0 8 * * *"   # 4:00 AM ET generation -> 9:00 AM ET publish
    - cron: "0 9 * * *"   # 5:00 AM ET generation -> 10:00 AM ET publish
    - cron: "0 10 * * *"  # 6:00 AM ET generation -> 11:00 AM ET publish
    - cron: "0 11 * * *"  # 7:00 AM ET generation -> 12:00 PM ET publish
    - cron: "0 12 * * *"  # 8:00 AM ET generation -> 1:00 PM ET publish
    - cron: "0 13 * * *"  # 9:00 AM ET generation -> 2:00 PM ET publish
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity (needed early, since status_store.py
          pushes live status updates DURING the run, not just at the end)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Allow ImageMagick to render text (moviepy TextClip needs this)
        run: sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the model
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Restore YouTube OAuth token
        run: |
          mkdir -p config
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > config/client_secret.json

      - name: Run pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python orchestrator.py

      - name: Persist the used-topics list so future runs don't repeat a topic
        if: always()
        run: |
          git add data/used_topics.json
          if git diff --cached --quiet; then
            echo "No used-topics changes to commit"
            exit 0
          fi
          git commit -m "Update used topics list"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely raced another workflow run) — pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Failed to push used-topics update after retries"
          exit 1

      - name: Upload status.json as build artifact (optional, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status
          path: data/status.json