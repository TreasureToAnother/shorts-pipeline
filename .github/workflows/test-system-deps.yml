name: Test system package install (temporary)

on:
  workflow_dispatch: {}

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached system packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-imagemagick-${{ runner.os }}-v1
      - name: Install ffmpeg and ImageMagick
        timeout-minutes: 20
        run: bash scripts/install_system_deps.sh
      - name: Show cache size
        run: du -sh ~/apt-cache && ls ~/apt-cache | wc -l
