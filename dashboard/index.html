<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mission Control — Story Pipeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05070d;
    --void-2: #0a0f1c;
    --panel: rgba(14, 20, 36, 0.72);
    --border: rgba(140, 170, 220, 0.14);
    --ice: #8ecae6;
    --ice-dim: #4f6a85;
    --gold: #ffd76a;
    --gold-soft: rgba(255, 215, 106, 0.55);
    --white: #eef3fa;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #0d1424 0%, var(--void) 60%, #020306 100%);
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    overflow-x: hidden;
  }

  /* starfield */
  .stars, .stars2, .stars3 {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .stars { background-image: radial-gradient(1px 1px at 20px 30px, white, transparent),
    radial-gradient(1px 1px at 120px 80px, white, transparent),
    radial-gradient(1px 1px at 220px 40px, white, transparent),
    radial-gradient(1px 1px at 300px 150px, white, transparent),
    radial-gradient(1px 1px at 400px 60px, white, transparent),
    radial-gradient(1px 1px at 500px 200px, white, transparent),
    radial-gradient(1px 1px at 620px 90px, white, transparent),
    radial-gradient(1px 1px at 720px 260px, white, transparent),
    radial-gradient(1px 1px at 90px 260px, white, transparent),
    radial-gradient(1px 1px at 850px 40px, white, transparent);
    background-repeat: repeat; background-size: 900px 500px; opacity: 0.5;
  }
  .stars2 { background-image: radial-gradient(1.5px 1.5px at 60px 120px, var(--ice), transparent),
    radial-gradient(1.5px 1.5px at 380px 300px, var(--ice), transparent),
    radial-gradient(1.5px 1.5px at 650px 180px, var(--ice), transparent),
    radial-gradient(1.5px 1.5px at 800px 380px, var(--ice), transparent);
    background-repeat: repeat; background-size: 900px 500px; opacity: 0.3; }

  header {
    position: relative; z-index: 2;
    text-align: center;
    padding: 36px 20px 10px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 30px; margin: 0; letter-spacing: 0.02em; color: var(--white);
  }
  .subhead { font-size: 12px; color: var(--ice-dim); margin-top: 8px; }

  .layout {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 24px;
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 24px 60px;
    min-height: 640px;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    backdrop-filter: blur(6px);
    align-self: start;
  }
  .panel h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ice);
    margin: 0 0 4px;
  }
  .panel .panel-sub { font-size: 11px; color: var(--ice-dim); margin-bottom: 16px; }

  .queue-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .queue-item:first-of-type { border-top: none; }
  .check {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--ice-dim); flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; transition: all 0.3s ease;
  }
  .queue-item.done .check { background: var(--gold-soft); border-color: var(--gold); color: #1a1200; }
  .queue-item.active .check { border-color: var(--ice); box-shadow: 0 0 8px var(--ice); animation: pulse-ring 1.2s ease-in-out infinite; }
  .queue-item.error .check { border-color: var(--error); background: rgba(255,107,107,0.2); }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .queue-text .time { font-size: 11px; color: var(--ice-dim); }
  .queue-text .title { font-size: 12px; color: var(--white); margin-top: 2px; line-height: 1.4; }
  .queue-text .title.muted { color: var(--ice-dim); font-style: italic; }
  .queue-text a { color: var(--ice); text-decoration: none; }
  .queue-text a:hover { text-decoration: underline; }
  .badge {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block;
  }
  .badge.live { background: rgba(255,215,106,0.18); color: var(--gold); }
  .badge.waiting { background: rgba(142,202,230,0.12); color: var(--ice); }

  .empty-note { font-size: 11px; color: var(--ice-dim); padding: 8px 0; }

  .solar-field {
    position: relative;
    min-height: 560px;
  }
  .planet-slot {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: default;
  }
  .planet-slot.tl { top: 20px; left: 20px; }
  .planet-slot.tr { top: 20px; right: 20px; }
  .planet-slot.bl { bottom: 20px; left: 20px; }
  .planet-slot.br { bottom: 20px; right: 20px; }

  .planet {
    width: 84px; height: 84px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), transparent 35%),
      radial-gradient(circle at 65% 70%, #1a5f3f 0%, transparent 40%),
      radial-gradient(circle at 30% 75%, #2d7a4f 0%, transparent 35%),
      radial-gradient(circle at 60% 40%, #1e5fa8 0%, #123a6b 60%, #0a2040 100%);
    box-shadow: inset -10px -10px 24px rgba(0,0,0,0.55), inset 6px 6px 14px rgba(255,255,255,0.06);
    transition: transform 0.25s ease, box-shadow 0.4s ease;
  }
  .planet-slot:hover .planet { transform: scale(1.14); }

  .planet-slot.running .planet {
    box-shadow: inset -10px -10px 24px rgba(0,0,0,0.5), inset 6px 6px 14px rgba(255,255,255,0.08),
      0 0 22px 6px var(--gold-soft), 0 0 46px 14px rgba(255,215,106,0.25);
    animation: glow-pulse 1.6s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.18); }
  }
  .planet-slot.done .planet { box-shadow: inset -10px -10px 24px rgba(0,0,0,0.5), 0 0 14px 3px rgba(120,220,160,0.35); }
  .planet-slot.error .planet { box-shadow: inset -10px -10px 24px rgba(0,0,0,0.5), 0 0 16px 4px rgba(255,107,107,0.5); }

  .planet-label { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; color: var(--white); text-align: center; }
  .planet-status { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }
  .planet-slot.idle .planet-status { color: var(--ice-dim); }
  .planet-slot.running .planet-status { color: var(--gold); }
  .planet-slot.done .planet-status { color: #7fd9a0; }
  .planet-slot.error .planet-status { color: var(--error); }

  .center-note {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; max-width: 260px;
  }
  .center-note .orbit-ring {
    width: 220px; height: 220px; border-radius: 50%;
    border: 1px dashed var(--border);
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: -1;
  }
  .center-note .msg { font-size: 11px; color: var(--ice-dim); line-height: 1.6; }
  .center-note .msg b { color: var(--ice); }

  footer { text-align: center; font-size: 10px; color: var(--ice-dim); padding-bottom: 30px; position: relative; z-index: 2; }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>

<header>
  <p class="eyebrow">Story Time Pipeline</p>
  <h1>Mission Control</h1>
  <p class="subhead">Four relays. Six flights a day. Reset at midnight ET.</p>
</header>

<div class="layout">

  <div class="panel">
    <h2>Today's Queue</h2>
    <p class="panel-sub">Created & uploaded</p>
    <div id="queue-list"></div>
  </div>

  <div class="solar-field">
    <div class="center-note">
      <div class="orbit-ring"></div>
      <div class="msg" id="center-msg">Reading the wire<br/><b>...</b></div>
    </div>

    <div class="planet-slot idle tl" id="planet-script_agent">
      <div class="planet"></div>
      <div class="planet-label">Script</div>
      <div class="planet-status">Idle</div>
    </div>
    <div class="planet-slot idle tr" id="planet-video_agent">
      <div class="planet"></div>
      <div class="planet-label">Edit</div>
      <div class="planet-status">Idle</div>
    </div>
    <div class="planet-slot idle bl" id="planet-upload_agent">
      <div class="planet"></div>
      <div class="planet-label">Upload</div>
      <div class="planet-status">Idle</div>
    </div>
    <div class="planet-slot idle br" id="planet-discord_agent">
      <div class="planet"></div>
      <div class="planet-label">Signal</div>
      <div class="planet-status">Idle</div>
    </div>
  </div>

  <div class="panel">
    <h2>Awaiting Release</h2>
    <p class="panel-sub">Scheduled, not yet public</p>
    <div id="release-list"></div>
  </div>

</div>

<footer>Auto-refreshes every few seconds</footer>

<script>
const AGENTS = ["script_agent", "video_agent", "upload_agent", "discord_agent"];
const IS_LOCAL = ["localhost", "127.0.0.1"].includes(window.location.hostname);
const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/TreasureToAnother/shorts-pipeline/main/data";
const STATUS_URL = IS_LOCAL ? "/status.json" : `${GITHUB_RAW_BASE}/status.json`;
const QUEUE_URL = IS_LOCAL ? "/queue.json" : `${GITHUB_RAW_BASE}/queue.json`;

function fmtHour(h) {
  const period = h >= 12 ? "PM" : "AM";
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:00 ${period} ET`;
}

function fmtPublish(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: true }) + " ET";
  } catch (e) { return iso; }
}

async function pollStatus() {
  try {
    const res = await fetch(STATUS_URL + "?_=" + Date.now());
    const data = await res.json();
    let anyRunning = false;
    AGENTS.forEach(a => {
      const el = document.getElementById("planet-" + a);
      if (!el) return;
      const state = data[a] || { status: "idle" };
      const corner = ["tl","tr","bl","br"].find(c => el.classList.contains(c)) || "";
      el.className = `planet-slot ${state.status} ${corner}`;
      const statusEl = el.querySelector(".planet-status");
      statusEl.textContent = state.status.charAt(0).toUpperCase() + state.status.slice(1);
      if (state.status === "running") anyRunning = true;
    });
    document.getElementById("center-msg").innerHTML = anyRunning
      ? "A flight is <b>in progress</b>."
      : "All relays <b>idle</b>.<br/>Waiting on the next slot.";
  } catch (e) {
    document.getElementById("center-msg").innerHTML = "Signal lost.<br/><b>Retrying...</b>";
  }
}

async function pollQueue() {
  try {
    const res = await fetch(QUEUE_URL + "?_=" + Date.now());
    const data = await res.json();
    const slots = data.slots || [];

    const queueList = document.getElementById("queue-list");
    queueList.innerHTML = "";
    slots.forEach(slot => {
      const done = slot.stage === "uploaded";
      const active = slot.stage === "generating";
      const error = slot.stage === "error";
      const cls = done ? "done" : active ? "active" : error ? "error" : "";
      const mark = done ? "✓" : error ? "!" : "";
      const div = document.createElement("div");
      div.className = "queue-item " + cls;
      div.innerHTML = `
        <div class="check">${mark}</div>
        <div class="queue-text">
          <div class="time">${fmtHour(slot.hour_et)}</div>
          <div class="title ${slot.title ? "" : "muted"}">${slot.title || (active ? "Generating…" : error ? "Failed" : "Not started")}</div>
        </div>`;
      queueList.appendChild(div);
    });

    const releaseList = document.getElementById("release-list");
    releaseList.innerHTML = "";
    const now = new Date();
    const awaiting = slots.filter(s => s.stage === "uploaded" && s.publish_at);
    if (awaiting.length === 0) {
      releaseList.innerHTML = '<div class="empty-note">Nothing scheduled yet today.</div>';
    }
    awaiting.forEach(slot => {
      const publishTime = new Date(slot.publish_at);
      const isLive = now >= publishTime;
      const div = document.createElement("div");
      div.className = "queue-item " + (isLive ? "done" : "");
      div.innerHTML = `
        <div class="check">${isLive ? "✓" : ""}</div>
        <div class="queue-text">
          <div class="title"><a href="${slot.video_url}" target="_blank">${slot.title}</a></div>
          <span class="badge ${isLive ? "live" : "waiting"}">${isLive ? "Live now" : "Releases " + fmtPublish(slot.publish_at)}</span>
        </div>`;
      releaseList.appendChild(div);
    });
  } catch (e) {
    // queue.json may not exist yet — fail quietly
  }
}

pollStatus();
pollQueue();
setInterval(pollStatus, 3000);
setInterval(pollQueue, 5000);
</script>

</body>
</html>
